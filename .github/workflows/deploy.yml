name: Deploy Picnic to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # 매일 새벽 3시(KST) / UTC 18:00에 구글 드라이브 새 사진 감지 및 자동 빌드
    - cron: '0 18 * * *'
  workflow_dispatch:

# Grant GITHUB_TOKEN permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# Do NOT cancel in-progress runs as production deployments must complete safely.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Static Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache synced photos
        uses: actions/cache@v4
        with:
          path: |
            public/photos
            .photo-cache.json
          key: picnic-photos-${{ github.run_id }}
          restore-keys: |
            picnic-photos-

      - name: Build site with Astro
        env:
          PUBLIC_KAKAO_MAP_KEY: ${{ secrets.PUBLIC_KAKAO_MAP_KEY || vars.PUBLIC_KAKAO_MAP_KEY }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
        run: npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
