name: Secret Scan (Gitleaks)

# 작성 도구(GitHub API 직접 커밋) 및 로컬 푸시/PR에 포함된 비밀 값을 독립적으로 검사합니다.
# 배포 워크플로(deploy.yml)와 완전히 분리되어 배포를 지연시키지 않고 결과만 알립니다.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
